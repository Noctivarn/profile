<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilman Putra Maulana — Portofolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
        --ungu: #0284C7;
        --ungu-tua: #075985;
        --teks-gelap: #0F172A;
        --teks-abu: #475569;
        --putih: #FFFFFF;
    }
    *{ box-sizing: border-box; margin:0; padding:0; }

    html{ min-height:100%; }

    body{
        font-family: 'Poppins', sans-serif;
        color: var(--teks-gelap);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        background: linear-gradient(-45deg, #e0f2fe, #bae6fd, #7dd3fc, #a5f3fc, #dbeafe);
        background-size: 400% 400%;
        animation: gradasiBiru 12s ease infinite;
    }

    @keyframes gradasiBiru{
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Bola-bola biru melayang */
    body::before, body::after{
        content:"";
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        z-index: -1;
        opacity: .6;
        pointer-events: none;
    }
    body::before{
        width: 420px; height: 420px;
        background: #38bdf8;
        top: -100px; left: -100px;
        animation: melayang1 14s ease-in-out infinite alternate;
    }
    body::after{
        width: 360px; height: 360px;
        background: #22d3ee;
        bottom: -100px; right: -80px;
        animation: melayang2 16s ease-in-out infinite alternate;
    }
    @keyframes melayang1{ to{ transform: translate(200px, 150px) scale(1.2); } }
    @keyframes melayang2{ to{ transform: translate(-220px, -120px) scale(1.15); } }

    a{ text-decoration:none; color:inherit; }

    /* ===== NAVBAR ===== */
    header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding: 24px 60px;
    }
    .logo{
        font-weight:700;
        font-size:1.2rem;
        color: var(--ungu);
    }
    nav ul{
        list-style:none;
        display:flex;
        gap: 32px;
    }
    nav a{
        font-size:0.95rem;
        font-weight:500;
        transition: color .2s ease;
    }
    nav a:hover{ color: var(--ungu); }

    /* ===== HERO ===== */
    .hero{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap: 40px;
        padding: 60px 60px 100px;
        flex-wrap: wrap;
    }
    .hero-teks{ max-width: 560px; }
    .hero-sapaan{
        color: var(--ungu);
        font-weight:600;
        font-size:1.1rem;
        margin-bottom: 12px;
    }
    .hero-nama{
        font-size: 3rem;
        font-weight: 800;
        line-height: 1.15;
        margin-bottom: 14px;
    }
    .hero-jabatan{
        font-size: 1.15rem;
        color: var(--teks-abu);
        margin-bottom: 20px;
    }
    .hero-jabatan a{
        color: var(--teks-gelap);
        font-weight:600;
        text-decoration: underline;
    }
    .hero-deskripsi{
        color: var(--teks-abu);
        line-height: 1.7;
        margin-bottom: 32px;
    }
    .btn-utama{
        display:inline-block;
        background: var(--ungu);
        color: var(--putih);
        font-weight:600;
        padding: 14px 30px;
        border-radius: 999px;
        transition: background .2s ease, transform .2s ease;
    }
    .btn-utama:hover{
        background: var(--ungu-tua);
        transform: translateY(-2px);
    }

    /* ===== DROPDOWN KONTAK ===== */
    .kontak-dropdown{ position: relative; display: inline-block; }
    .kontak-dropdown .btn-utama{
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-size: 1rem;
    }
    .dropdown-menu{
        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        min-width: 200px;
        background: var(--putih);
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(2, 132, 199, .25);
        padding: 8px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: opacity .2s ease, transform .2s ease, visibility .2s;
        z-index: 10;
        text-align: left;
    }
    .dropdown-menu.buka{
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
    .dropdown-menu a{
        display: block;
        padding: 12px 16px;
        border-radius: 10px;
        font-weight: 500;
        transition: background .2s ease;
    }
    .dropdown-menu a:hover{ background: #e0f2fe; color: var(--ungu-tua); }

    /* ===== FOTO ===== */
    .hero-foto{
        width: 380px;
        height: 380px;
        position: relative;
        flex-shrink:0;
    }
    .hero-foto .lingkaran{
        position:absolute;
        inset: -16px;
        background: var(--putih);
        border-radius: 50%;
        z-index:1;
        box-shadow: 0 10px 40px rgba(2, 132, 199, .25);
    }
    .hero-foto img{
        position:relative;
        z-index:2;
        width:100%;
        height:100%;
        border-radius: 50%;
        object-fit: cover;
        object-position: top center;
        display:block;
    }

    /* ===== RESPONSIF ===== */
    @media (max-width: 900px){
        header{ padding: 20px 24px; flex-direction:column; gap:16px; }
        nav ul{ flex-wrap:wrap; justify-content:center; gap:16px 20px; }
        .hero{ padding: 40px 24px 60px; justify-content:center; text-align:center; }
        .hero-teks{ max-width: 100%; }
        .hero-jabatan, .hero-deskripsi{ margin-left:auto; margin-right:auto; }
        .dropdown-menu{ left: 50%; margin-left: -100px; }
    }
    @media (max-width: 480px){
        .hero-nama{ font-size: 2.1rem; }
        .hero-foto{ width: 260px; height: 260px; }
    }
</style>
</head>
<body>

<header>
    <div class="logo">Hilman</div>
    <nav>
        <ul>
            <li><a href="#beranda">Beranda</a></li>
            <li><a href="#tentang">Tentang Saya</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#pendidikan">Pendidikan</a></li>
            <li><a href="#pengalaman">Pengalaman</a></li>
            <li><a href="#blog">Blog</a></li>
            <li><a href="#kontak">Kontak</a></li>
        </ul>
    </nav>
</header>

<section class="hero" id="beranda">
    <div class="hero-teks">
        <p class="hero-sapaan">Halo Semua, Saya</p>
        <h1 class="hero-nama">Hilman Putra Maulana</h1>
        <p class="hero-jabatan">IT Programmer</p>
        <p class="hero-deskripsi">Portofolio ini menampilkan proyek dan kontribusi saya sebagai pengembang di bidang teknologi.</p>

        <div class="kontak-dropdown">
            <button type="button" class="btn-utama" id="btnKontak" aria-expanded="false">
                Hubungi Saya ▾
            </button>
            <div class="dropdown-menu" id="menuKontak">
                <!-- GANTI 6281234567890 dengan nomor WA kamu (format 62, tanpa 0 di depan) -->
                <a href="https://wa.me/6281234567890?text=Halo%20Hilman%2C%20saya%20tertarik%20dengan%20portofolio%20kamu" target="_blank" rel="noopener">
                    💬 WhatsApp
                </a>
                <a href="mailto:hilmanputramaulana@gmail.com?subject=Tertarik%20dengan%20Portofolio">
                    ✉️ Email
                </a>
            </div>
        </div>
    </div>

    <div class="hero-foto">
        <div class="lingkaran"></div>
        <img src="img/pp 2.jpeg" alt="Foto Hilman Putra Maulana">
    </div>
</section>

<script>
    const btn  = document.getElementById('btnKontak');
    const menu = document.getElementById('menuKontak');

    btn.addEventListener('click', function(e){
        e.stopPropagation();
        const terbuka = menu.classList.toggle('buka');
        btn.setAttribute('aria-expanded', terbuka);
    });

    // Tutup kalau klik di luar atau tekan Esc
    document.addEventListener('click', function(){
        menu.classList.remove('buka');
        btn.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('keydown', function(e){
        if (e.key === 'Escape') {
            menu.classList.remove('buka');
            btn.setAttribute('aria-expanded', 'false');
        }
    });
</script>

</body>
</html>
